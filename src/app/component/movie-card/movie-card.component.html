@if (allMovies) {
  <div class="container">
    <div class="row row-cols-1 row-cols-md-4 g-4">

      @for (movie of allMovies; track movie.id) {
        <div class="col">
          <img [src]="'https://image.tmdb.org/t/p/w500/' + movie.poster_path"  alt="...">
          <div>
            <h5>{{movie.title}}</h5>
          </div>
        </div>
      }
    </div>
  </div>
}
